<!DOCTYPE HTML>
<html>
	<head>

		<script type="text/javascript" src="css_hacims/jscharts/highcharts.js"></script>

		<!-- 2. Add the JavaScript to initialize the chart on document ready -->
		<script type="text/javascript">
		
			var chart;
			$(document).ready(function() {
				chart = new Highcharts.Chart({
					chart: {
						renderTo: 'container',
						defaultSeriesType: 'column'
						 
					},
					title: {
						text: 'Blood Sugar Chart'
					},
					subtitle: {
						text: 'Datewise'
					},
					xAxis: {
						categories: [
							'Sep 10, 2011', 
							'Sep 11, 2011', 
							'Sep 12, 2011', 
							'Sep 13, 2011', 
							'Sep 14, 2011', 
							'Sep 15, 2011'
							
						]
					},
					yAxis: {
						min: 0,
						title: {
							text: 'Values'
						}
					},
					legend: {
						layout: 'vertical',
						backgroundColor: '#FFFFFF',
						align: 'left',
						verticalAlign: 'top',
						x: 100,
						y: 70,
						floating: true,
						shadow: true
					},
					tooltip: {
						formatter: function() {
							return ''+
								this.x +': '+ this.y +' points';
						}
					},
					plotOptions: {
						column: {
							pointPadding: 0.2,
							borderWidth: 0
						}
					},
				        series: [{
						name: 'Blood Sugar Chart',
						data: [{y:100,color:'red'}, {y:70,color:'yello'}, {y:40,color:'pink'}, {y:80,color:'gray'}, {y:40,color:'orange'}, 135],
						dataLabels: {
       			        enabled: true,
						color:'black',
         			    formatter: function() {
           			    return this.y;
            }
         }        
						}]
						
				});
				
				
			});
				
				
				
		  Highcharts.theme = {
   colors: ['#4572A7'],
   chart: {
      backgroundColor: {
         linearGradient: [0, 0, 500, 500],
         stops: [
            [0, 'rgb(255, 255, 255)'],
            [1, 'rgb(240, 240, 255)']
         ]
      }
,
      borderWidth: 2,
      plotBackgroundColor: 'rgba(255, 255, 255, .9)',
      plotShadow: true,
      plotBorderWidth: 1
   },
   title: {style: { color: '#000', font: 'bold 16px "Trebuchet MS", Verdana, sans-serif'}},
   subtitle: {style: { color: '#666666', font: 'bold 12px "Trebuchet MS", Verdana, sans-serif' }},
   xAxis: {
      gridLineWidth: 1,
      lineColor: '#000',

            color: '#000',
            font: '11px Trebuchet MS, Verdana, sans-serif'
         }
      },

            color: '#333',
            fontWeight: 'bold',
            fontSize: '12px',
            fontFamily: 'Trebuchet MS, Verdana, sans-serif'

         }            
      }
   },
   yAxis: {
      minorTickInterval: 'auto',
      lineColor: '#000',
      lineWidth: 1,
      tickWidth: 1,
      tickColor: '#000',
      labels: {
         style: {
            color: '#000',
            font: '11px Trebuchet MS, Verdana, sans-serif'
         }
      },
      title: {
         style: {
            color: '#333',
            fontWeight: 'bold',
            fontSize: '12px',
            fontFamily: 'Trebuchet MS, Verdana, sans-serif'

      itemStyle: {

      itemHiddenStyle: {
         color: 'gray'
      }
   },
   labels: {
      style: {
         color: '#99b'
      }
   }
};
       		
	var highchartsOptions = Highcharts.setOptions(Highcharts.theme);	
	
			
		</script>
	 
	</head>

		<div id="container" style="width:1000px; height: 400px; margin: 0 auto"></div>
